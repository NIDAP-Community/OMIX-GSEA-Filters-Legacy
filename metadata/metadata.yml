metadata_version: 1
name: Omix GSEA Filter
description: Filters Gene Set Enrichment Analysis (GSEA) results based on statistical
  thresholds (FDR, NES), pathway annotations, gene sets, and experimental contrasts.
  Outputs include a filtered results table (CSV), filtering summary visualization,
  and enrichment direction plots showing pathway retention across contrasts.
